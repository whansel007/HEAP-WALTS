<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Manga Tracker</h1>
      <div class="header-actions">
        <div class="more-menu-container">
          <button id="more-btn" title="More settings & features">⚙️</button>
          <div id="more-dropdown" class="more-dropdown hidden">
            <div class="dropdown-section">
              <h4>Settings</h4>
              <label>
                API Key
                <input id="setting-api-key" type="password" placeholder="API Key...">
              </label>
              <label>
                Backend URL
                <input id="setting-api-base" type="text" placeholder="http://localhost:3001/api">
              </label>
              <label>
                Default Status
                <select id="setting-default-status">
                  <option value="Later">Later</option>
                  <option value="Current">Current</option>
                  <option value="Finished">Finished</option>
                </select>
              </label>
              <label>
                Anime URL Template
                <span class="field-desc">Used when saving from MyAnimeList. Insert {NAME} where the anime slug should go.</span>
                <input id="setting-anime-template" type="text" placeholder="https://www.miruro.to/search?query={NAME}">
              </label>
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-section">
              <h4>Features</h4>
              <button id="btn-export-data" class="dropdown-btn">📤 Export Bookmarks</button>
              <button id="btn-import-data" class="dropdown-btn">📥 Import Bookmarks</button>
              <input type="file" id="import-file-input" accept=".json" class="hidden">
              <button id="btn-clear-data" class="dropdown-btn danger">🗑️ Clear All Data</button>
            </div>
          </div>
        </div>
        <button id="translate-btn" title="Look up a word in the dictionary">Translate</button>
        <button id="kana-btn" title="Kana chart">あ</button>
        <button id="save-btn">+ Save Page</button>
      </div>
    </header>
    <div id="current-reading" class="hidden"></div>
    <div class="media-tabs">
      <button class="media-tab active" data-media-type="manga">📖 Manga</button>
      <button class="media-tab" data-media-type="anime">🎬 Anime</button>
    </div>
    <div class="search-bar">
      <input id="search" type="text" placeholder="Search manga...">
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="Current">Current</button>
      <button class="filter" data-filter="Later">Later</button>
      <button class="filter" data-filter="Finished">Finished</button>
      <select id="tag-filter" class="filter-select">
        <option value="">All Tags</option>
      </select>
    </div>

    <div id="list"></div>

    <div id="empty-state" class="hidden">
      <div id="empty-icon" class="empty-icon">📚</div>
      <p id="empty-title" class="empty-title">No manga saved yet</p>
      <p id="empty-sub" class="empty-sub">Click "+ Save Page" while on a manga chapter to add it.</p>
    </div>

    <div id="loading" class="hidden">
      <span class="spinner"></span> Loading...
    </div>
  </div>

  <div id="modal" class="hidden">
    <div class="modal-content">
      <h3>Edit Entry</h3>
      <label>
        Title
        <input id="edit-title" type="text" placeholder="Title...">
      </label>
      <label>
        URL
        <input id="edit-url" type="url" placeholder="https://...">
      </label>
      <label>
        Chapter
        <input id="edit-chapter" type="number" min="0" placeholder="0">
      </label>
      <label>
        Status
        <select id="edit-status">
          <option value="Current">Current</option>
          <option value="Later">Later</option>
          <option value="Finished">Finished</option>
        </select>
      </label>
      <label>
        Type
        <button id="edit-media-type" type="button" class="modal-toggle-btn">📖 Manga</button>
      </label>
      <label>
        Update Schedule
        <input id="edit-schedule" type="text" placeholder="e.g. Weekly on Sundays, Monthly">
      </label>
      <label>
        Tags
        <div id="modal-tags-container" class="modal-tags-container"></div>
        <div class="tag-input-group">
          <input id="tag-input" type="text" list="existing-tags" placeholder="Add tag...">
          <datalist id="existing-tags"></datalist>
          <button id="btn-add-tag" type="button">+</button>
        </div>
      </label>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <div id="kana-modal" class="hidden">
    <div class="kana-modal-content">
      <div class="kana-modal-header">
        <h3>Hiragana / Katakana</h3>
        <button id="kana-close">✕</button>
      </div>
      <div id="kana-grid" class="kana-grid"></div>
    </div>
  </div>

  <div id="dict-modal" class="hidden">
    <div class="dict-modal-content">
      <div class="dict-modal-header">
        <h3>Japanese Dictionary</h3>
        <button id="dict-close">✕</button>
      </div>
      <div class="dict-search-bar">
        <input id="dict-input" type="text" placeholder="Enter word (English or Japanese)...">
        <button id="dict-search-btn">Search</button>
      </div>
      <div id="dict-results" class="dict-results"></div>
    </div>
  </div>

  <div id="status-toast" class="hidden"></div>
  <script type="module" src="popup/popup.js"></script>
</body>
</html>
